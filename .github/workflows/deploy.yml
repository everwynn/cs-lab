# --------① 工作流名字，Actions页面展示的标题--------
name: Deploy to GitHub Pages

# --------② 触发条件：什么时候执行这套流程--------
on:
  push:
    branches: [main]                # 每次推送到 main 分支就触发
  workflow_dispatch:                # 也支持手动触发

# --------③ 权限设置，给部署Pages的必要权限--------
permissions:
  contents: read
  pages: write
  id-token: write

# --------④ 并发控制：多次推送时，取消旧的构建任务--------
concurrency:
  group: "pages"
  cancel-in-progress: false

# --------⑤ job任务：分为build（构建）、deploy（发布）两步--------
jobs:
  build:
    runs-on: ubuntu-latest                # 在GitHub提供的Ubuntu云虚拟机运行
    steps:
      - name: Checkout
        uses: actions/checkout@v4         # 步骤1：把你的仓库代码下载到云服务器

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'              # 步骤2：安装Node20环境
          cache: 'npm'

      - name: Install dependencies
        run: npm ci                       # 步骤3：安装项目全部依赖

      - name: Build
        run: npm run build                # 构建命令

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist                    # Astro 默认输出到 dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
